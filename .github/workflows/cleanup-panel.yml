name: Cleanup Command Panel

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'true=真正删除超期评论；false=dry-run 只体检（默认 dry-run，更安全）'
        type: boolean
        default: false
        required: false
      keep:
        description: '每个命令组保留的最近评论数（≤ 组内评论总数时不会删除任何评论）'
        type: string
        default: '10'
        required: false

permissions:
  contents: write   # 提交 archive/commands.json
  issues: write     # 删除命令面板历史评论
  actions: write    # 派发 deploy-pages.yml

concurrency:
  group: cleanup-panel
  # 不取消：定时任务撞车时排队执行，避免「清理到一半被取消」留下半截归档
  # Don't cancel: queue scheduled runs to avoid partial archive from cancellation
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # 归档是累积文件，历史可能被并发 push 改动；浅克隆下 git push 会被拒，要完整历史。
          # Archive is cumulative; shallow clone causes push rejection, need full history.
          fetch-depth: 0

      # 归档与清理（apply/keep 表达式直传：定时固定 apply=true、keep=10，手动默认 dry-run）
      # 注意：inputs.apply 是布尔值，不能与字符串 'true' 做 ==（类型不匹配会转数字比较恒为 false）
      # Archive and clean (schedule forces apply=true/keep=10; dispatch defaults to dry-run)
      - name: Archive and clean / 归档与清理
        id: clean
        uses: acg-q/userscript-console@v1
        with:
          command: cleanup
          github-token: ${{ secrets.GITHUB_TOKEN }}
          keep: ${{ inputs.keep || '10' }}
          apply: ${{ github.event_name == 'schedule' || inputs.apply }}
          use-binary: true

      # 提交归档（白名单 archive；changed=false 时整步跳过）
      # Commit archive (path allowlist; skipped entirely when changed=false)
      - name: 提交归档 / Commit archive
        id: commit
        if: ${{ steps.clean.outputs.changed == 'true' }}
        run: >-
          git config user.name "github-actions[bot]" &&
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" &&
          git add archive &&
          (git diff --staged --quiet ||
          (git commit -m "chore(archive): 归档命令面板历史评论" && git push))

      # 派发站点重建（仅在提交步骤成功后；GITHUB_TOKEN push 不触发 workflow）
      # Dispatch rebuild (only after a successful commit step; GITHUB_TOKEN push doesn't trigger)
      - name: 派发站点重建 / Dispatch site rebuild
        if: ${{ steps.commit.outcome == 'success' }}
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh workflow run deploy-pages.yml
