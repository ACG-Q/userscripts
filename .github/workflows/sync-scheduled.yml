name: Scheduled Sync

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write
  discussions: write

concurrency:
  group: scheduled-sync
  cancel-in-progress: false

jobs:
  sync-all:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # 执行 /sync-all（身份注入与原版一致：以仓库拥有者名义执行）
      # Run /sync-all (identity injected as repo owner, same as before)
      - name: Run /sync-all
        id: cmd
        uses: acg-q/userscript-console@dd7084e806c15139613958fddbcf8f35f4adca02
        with:
          command: run-command
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-body: /sync-all
          comment-user: ${{ github.repository_owner }}
          issue-number: '1'
          use-binary: true
          binary-version: '1.1.3'
          binary-sha256: '6e2cb3fa80e3e75bf9037bc19180c1e54a094488ec9e0a86e37978430ebf254f'

      # 投影对账
      # Project issues
      - name: Project issues
        id: proj
        uses: acg-q/userscript-console@dd7084e806c15139613958fddbcf8f35f4adca02
        with:
          command: project
          github-token: ${{ secrets.GITHUB_TOKEN }}
          use-binary: true
          binary-version: '1.1.3'
          binary-sha256: '6e2cb3fa80e3e75bf9037bc19180c1e54a094488ec9e0a86e37978430ebf254f'

      # 提交变更（白名单 registry/scripts/dist；无更新则 committed=false 短路）
      # Commit changes (allowlist; committed=false short-circuits when no update)
      - name: Commit changes
        id: commit
        run: 'python tools/commit.py --allowlist registry.json scripts dist --message "chore: 同步第三方脚本"'

      # 派发站点部署（仅在真提交后）
      # Trigger site deploy (only after a real commit)
      - name: Trigger site deploy
        if: steps.commit.outputs.committed == 'true'
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: python tools/dispatch_deploy.py --workflow deploy-pages.yml
