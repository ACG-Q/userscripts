name: Scheduled Sync

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write
  discussions: write

concurrency:
  group: scheduled-sync
  cancel-in-progress: false

jobs:
  sync-all:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # 执行 /sync-all（身份注入与原版一致：以仓库拥有者名义执行）；
      # schedule 无评论上下文，post-reply 关闭（原版也无回帖步骤）
      # Run /sync-all (identity injected as repo owner); no reply on schedule
      - name: Run /sync-all
        id: cmd
        uses: acg-q/userscript-console@v1
        with:
          command: run-command
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-body: /sync-all
          comment-user: ${{ github.repository_owner }}
          issue-number: '1'
          post-reply: 'false'
          use-binary: true

      # 投影对账
      # Project issues
      - name: Project issues
        id: proj
        uses: acg-q/userscript-console@v1
        with:
          command: project
          github-token: ${{ secrets.GITHUB_TOKEN }}
          use-binary: true

      # 提交变更（白名单 registry/scripts/dist；changed=false 时整步跳过）
      # Commit changes (path allowlist; skipped entirely when changed=false)
      - name: Commit changes
        id: commit
        if: ${{ steps.cmd.outputs.changed == 'true' }}
        run: >-
          git config user.name "github-actions[bot]" &&
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" &&
          git add registry.json scripts dist &&
          (git diff --staged --quiet ||
          (git commit -m "chore: 同步第三方脚本" && git push))

      # 派发站点部署（仅在提交步骤成功后；GITHUB_TOKEN push 不触发 workflow）
      # Trigger site deploy (only after a successful commit step; GITHUB_TOKEN push doesn't trigger)
      - name: Trigger site deploy
        if: ${{ steps.commit.outcome == 'success' }}
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh workflow run deploy-pages.yml
