name: Scheduled Sync
on:
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write
  discussions: write
concurrency:
  group: scheduled-sync
  cancel-in-progress: false

jobs:
  sync-all:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # 零手填二进制：@v1.1.0 + use-binary: true
      # Zero-config binary: @v1.1.0 + use-binary: true
      - name: Run /sync-all / 执行同步
        id: cmd
        uses: acg-q/userscript-console@v1.1.0
        with:
          command: run-command
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-body: /sync-all
          comment-user: ${{ github.repository_owner }}
          issue-number: '1'
          use-binary: true

      # 投影对账
      # Project issues
      - name: Project issues / 投影对账
        id: proj
        uses: acg-q/userscript-console@v1.1.0
        with:
          command: project
          github-token: ${{ secrets.GITHUB_TOKEN }}
          use-binary: true

      # 提交变更
      # Commit changes
      - name: Commit changes / 提交变更
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json scripts dist
          if git diff --staged --quiet; then echo "无更新"; else
            git commit -m "chore: 同步第三方脚本"; git push; echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # 派发站点部署
      # Trigger site deploy
      - name: Trigger site deploy / 派发站点部署
        if: steps.commit.outputs.pushed == 'true'
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh workflow run deploy-pages.yml -R ${{ github.repository }} \
            || echo "⚠️ 派发失败（不阻断）"