name: Deploy to GitHub Pages
on:
  push: { branches: [master] }
  issues: { types: [opened, edited, closed, reopened] }
  issue_comment: { types: [created, edited, deleted] }
  discussion_comment: { types: [created] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  issues: read
  discussions: read
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 命令面板 #1 的动态不进站点；discussion_comment 无 issue 上下文需显式放行
    # Skip command panel #1; discussion_comment needs explicit allow (no issue context)
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'discussion_comment' || github.event.issue.number != 1 }}
    steps:
      - uses: actions/checkout@v5

      # 命令文档源在工具仓（docs/ 与代码同 PR 演进）；拉取后由 build 转换发布为本站 /docs/
      # Command docs source lives in the tool repo; fetched here so build publishes /docs/ on this site
      - uses: actions/checkout@v5
        with:
          repository: acg-q/userscript-console
          path: tool-docs
          sparse-checkout: docs
      - name: 放置文档源 / Place docs source
        run: cp -r tool-docs/docs ./docs

      # 构建站点并搬移 _site（pages-out 收编原站点组装步骤，语义不变）
      # Build site and move into _site (pages-out folds the old assemble step)
      - name: 构建站点 / Build site
        id: build
        uses: acg-q/userscript-console@v1
        with:
          command: build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pages-out: _site
          use-binary: true

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with: { path: ./_site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v5
