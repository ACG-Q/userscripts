name: Deploy to GitHub Pages
on:
  push: { branches: [master] }
  issues: { types: [opened, edited, closed, reopened] }
  issue_comment: { types: [created, edited, deleted] }
  discussion_comment: { types: [created] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  issues: read
  discussions: read
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 命令面板 #1 的动态不进站点；discussion_comment 无 issue 上下文需显式放行
    # Skip command panel #1; discussion_comment needs explicit allow (no issue context)
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'discussion_comment' || github.event.issue.number != 1 }}
    steps:
      - uses: actions/checkout@v5

      # 使用 action 的零手填二进制模式构建站点（替代原手写下载+校验步骤）
      # Use action's zero-config binary mode to build site (replaces manual download+verify)
      - name: 构建站点 / Build site
        id: build
        uses: acg-q/userscript-console@v1.1.0
        with:
          command: build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          use-binary: true

      # 组装 _site 目录结构（Pages 特有，属本仓）
      # Assemble _site directory structure (Pages-specific, belongs to this repo)
      - name: 组装 _site / Assemble _site
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d dist ]; then
            echo "::error::dist/ 不存在 —— build 未产出任何内容"
            exit 1
          fi
          mkdir -p _site/dist
          # 站点页面：index.html / scripts.json / scripts/ / commands/
          # Site pages: index.html / scripts.json / scripts/ / commands/
          for item in dist/*; do
            base=$(basename "$item")
            case "$base" in
              *.user.js) mv "$item" _site/dist/ ;;   # 安装包放 _site/dist/ / Install packages to _site/dist/
              *)          mv "$item" _site/ ;;         # 其余是站点产物 / Rest are site artifacts
            esac
          done
          echo "--- _site 结构 / _site structure ---"
          find _site -maxdepth 2 | head -30

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with: { path: ./_site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v5