name: Init Command Panel
on:
  workflow_dispatch:
permissions:
  issues: write
  contents: read

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 设计 D2：统一 checkout-first，用 tools/init_panel.py 做幂等初始化
    # D2: checkout-first; idempotent init via tools/init_panel.py
    steps:
      - uses: actions/checkout@v5

      # 面板已存在则跳过，否则创建（tools/init_panel.py）
      # Skip if panel exists, else create (tools/init_panel.py)
      - name: Init panel
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: python tools/init_panel.py
