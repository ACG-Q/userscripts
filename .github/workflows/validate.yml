name: Validate
on:
  push: { branches: [master] }
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: "validate-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # registry 可解析且结构合法（tools/validate_registry.py）
      # registry is parseable and structurally valid (tools/validate_registry.py)
      - name: registry 可解析且结构合法 / Validate registry structure
        run: python tools/validate_registry.py

      # 数据一致性（doctor）——零手填二进制：@v1.1.2 + use-binary: true
      # Data consistency (doctor) — zero-config binary: @v1.1.2 + use-binary: true
      - name: 数据一致性（doctor） / Data consistency check
        uses: acg-q/userscript-console@v1.1.2
        with:
          command: doctor
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          use-binary: true
