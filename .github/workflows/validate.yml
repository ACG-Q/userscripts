name: Validate
on:
  push: { branches: [master] }
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: "validate-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # registry 可解析且结构合法（tools/validate_registry.py）
      # registry is parseable and structurally valid (tools/validate_registry.py)
      - name: registry 可解析且结构合法 / Validate registry structure
        run: python tools/validate_registry.py

      # 工具仓 GraphQL 查询对官方 schema 校验（基线 I2；第二 checkout 取查询源）
      # Tool-repo GraphQL queries validated against the official schema (baseline I2)
      - uses: actions/checkout@v5
        with:
          repository: acg-q/userscript-console
          path: tool-src
      - name: 安装 GraphQL 校验依赖 / Install graphql-core
        run: python -m pip install graphql-core==3.3.0
      - name: GraphQL schema 校验 / Validate GraphQL queries
        run: python tools/validate_graphql.py --go-dir tool-src

      # 数据一致性（doctor）——零手填二进制：@dd7084e806c15139613958fddbcf8f35f4adca02 + use-binary: true
      # Data consistency (doctor) — zero-config binary: @dd7084e806c15139613958fddbcf8f35f4adca02 + use-binary: true
      - name: 数据一致性（doctor） / Data consistency check
        uses: acg-q/userscript-console@dd7084e806c15139613958fddbcf8f35f4adca02
        with:
          command: doctor
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          use-binary: true
          binary-version: '1.1.3'
          binary-sha256: '6e2cb3fa80e3e75bf9037bc19180c1e54a094488ec9e0a86e37978430ebf254f'
