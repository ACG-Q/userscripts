name: Validate
on:
  push: { branches: [master] }
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: "validate-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # 数据一致性自检（registry 结构与 schema 版本、源码/dist/归档一致性，
      # 收编原 registry 结构自检；GraphQL schema 校验归属工具仓，本仓副本已删）
      # Data doctor (folds registry structure validation; GraphQL checks live in the tool repo)
      - name: 数据一致性自检 / Data doctor
        uses: acg-q/userscript-console@v1
        with:
          command: doctor
          github-token: ${{ secrets.GITHUB_TOKEN }}
          use-binary: true
